packages:
  - 'contracts'
  - 'services/*'
  - 'frontend/*'
  - 'shared'
  - 'subgraph'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  keccak: true
  prisma: true
  protobufjs: true
  secp256k1: true

overrides:
  esbuild: 0.21.5

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - keccak
  - prisma
  - protobufjs
  - secp256k1
