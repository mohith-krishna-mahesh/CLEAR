# Network-wide Hyperledger Besu configuration for CLEAR IBFT2 cluster
genesis-file = "/opt/besu/genesis.json"
network-id = 1337

# RPC HTTP Configuration
rpc-http-enabled = true
rpc-http-host = "0.0.0.0"
rpc-http-port = 8545
rpc-http-api = ["ETH", "NET", "IBFT", "WEB3"]
rpc-http-cors-origins = ["*"]
host-allowlist = ["*"]

# P2P Networking
p2p-enabled = true
p2p-port = 30303
discovery-enabled = true

# Mining / IBFT2 Block Creation
miner-enabled = true
miner-coinbase = "0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"

# Logging
logging = "INFO"
